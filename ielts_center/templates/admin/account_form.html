{% extends "base.html" %}
{% block title %}Tạo tài khoản{% endblock %}

{% block content %}
<div class="row justify-content-center">
  <div class="col-lg-6">
    <h4 class="page-title">Tạo tài khoản</h4>
    <p class="page-sub mb-3">Chọn vai trò Giáo viên hoặc Học viên sẽ tự tạo kèm hồ sơ trống.</p>

    <div class="card">
      <div class="card-body">
        <form method="post" novalidate>
          <div class="row g-3">
            <div class="col-md-6">
              <label class="form-label">Tên đăng nhập <span class="text-danger">*</span></label>
              <input name="username" class="form-control" required>
            </div>
            <div class="col-md-6">
              <label class="form-label">Mật khẩu</label>
              <input name="password" class="form-control" placeholder="mặc định 123456">
            </div>
            <div class="col-md-6">
              <label class="form-label">Họ và tên <span class="text-danger">*</span></label>
              <input name="full_name" class="form-control" required>
            </div>
            <div class="col-md-6">
              <label class="form-label">Vai trò <span class="text-danger">*</span></label>
              <select name="role" class="form-select" required>
                {% for key, label in role_labels.items() %}
                  <option value="{{ key }}">{{ label }}</option>
                {% endfor %}
              </select>
            </div>
            <div class="col-md-6">
              <label class="form-label">Email</label>
              <input name="email" type="email" class="form-control">
            </div>
            <div class="col-md-6">
              <label class="form-label">Số điện thoại</label>
              <input name="phone" class="form-control">
            </div>
          </div>

          <hr class="my-4">
          <button class="btn btn-primary" style="background:var(--brand);border:none"><i class="bi bi-check-lg"></i> Tạo tài khoản</button>
          <a href="{{ url_for('admin.accounts') }}" class="btn btn-light">Hủy</a>
        </form>
      </div>
    </div>
  </div>
</div>
{% endblock %}
