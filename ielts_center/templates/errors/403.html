{% extends "base.html" %}
{% block title %}Không có quyền truy cập{% endblock %}
{% block content %}
<div class="text-center py-5">
  <div style="font-size:3rem;color:#d1495b"><i class="bi bi-shield-exclamation"></i></div>
  <h3 class="page-title mt-2">403 · Không có quyền truy cập</h3>
  <p class="page-sub">Vai trò <strong>{{ current_user.role_label if current_user.is_authenticated else 'khách' }}</strong>
    không được phép mở chức năng này.</p>
  <a href="{{ url_for('auth.index') }}" class="btn btn-primary mt-2" style="background:var(--brand);border:none">Về trang chủ</a>
</div>
{% endblock %}
