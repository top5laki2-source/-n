{% extends "base.html" %}
{% block title %}Quên mật khẩu{% endblock %}

{% block content %}
<div class="auth-card">
  <div class="auth-logo"><i class="bi bi-question-circle"></i></div>
  <h5 class="text-center mb-1" style="color:var(--brand-dark);font-weight:700">Quên mật khẩu</h5>
  <p class="text-center text-muted small mb-4">
    Gửi yêu cầu đến quản trị viên để được đặt lại mật khẩu.
  </p>

  <form method="post" novalidate>
    <div class="mb-3">
      <label class="form-label">Tên đăng nhập</label>
      <input type="text" name="username" class="form-control" required autofocus>
    </div>
    <div class="mb-3">
      <label class="form-label">Email đã đăng ký</label>
      <input type="email" name="email" class="form-control" required>
    </div>
    <button class="btn btn-primary w-100 py-2" style="background:var(--brand);border:none">
      Gửi yêu cầu
    </button>
  </form>

  <div class="text-center mt-3">
    <a href="{{ url_for('auth.login') }}" class="small text-decoration-none">← Quay lại đăng nhập</a>
  </div>
</div>
{% endblock %}
