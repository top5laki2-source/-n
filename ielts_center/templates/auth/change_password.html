{% extends "base.html" %}
{% block title %}Đổi mật khẩu{% endblock %}

{% block content %}
<div class="row justify-content-center">
  <div class="col-lg-5">
    <h4 class="page-title">Đổi mật khẩu</h4>
    <p class="page-sub mb-3">Mật khẩu mới phải có ít nhất 6 ký tự.</p>

    <div class="card">
      <div class="card-body">
        <form method="post" novalidate>
          <div class="mb-3">
            <label class="form-label">Mật khẩu hiện tại</label>
            <input type="password" name="old_password" class="form-control" required>
          </div>
          <div class="mb-3">
            <label class="form-label">Mật khẩu mới</label>
            <input type="password" name="new_password" class="form-control" minlength="6" required>
          </div>
          <div class="mb-3">
            <label class="form-label">Xác nhận mật khẩu mới</label>
            <input type="password" name="confirm_password" class="form-control" minlength="6" required>
          </div>
          <button class="btn btn-primary" style="background:var(--brand);border:none">Cập nhật</button>
          <a href="{{ url_for('auth.index') }}" class="btn btn-light">Hủy</a>
        </form>
      </div>
    </div>
  </div>
</div>
{% endblock %}
